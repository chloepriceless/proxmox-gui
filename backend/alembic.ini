# Alembic configuration for the Proxmox Self-Service GUI backend.
#
# At application boot, app/core/db.py::run_migrations programmatically loads
# this file and invokes ``command.upgrade(cfg, "head")``. The sqlalchemy.url
# below is a placeholder -- the real URL comes from PROXMOX_GUI_DATABASE_URL
# and is set on the Config object before invocation. Tests likewise
# override via cfg.set_main_option("sqlalchemy.url", ...).

[alembic]
# Location of the migration script directory, relative to this file.
script_location = alembic

# Prepend the backend/ directory (the cwd when alembic is invoked from
# inside backend/) to sys.path so env.py can ``from app.models import Base``.
# Pytest sets the same path via pyproject.toml's pythonpath; this line
# makes the CLI behave identically. Pitfall: without this, ``alembic
# upgrade head`` invoked by the installer fails with ModuleNotFoundError.
prepend_sys_path = .

# Template for new revision filenames: zero-padded sequence + slug.
file_template = %%(rev)s_%%(slug)s

# Timezone for ``op.now()`` rendering. UTC keeps cross-machine consistency.
timezone = UTC

# Use os.pathsep on the host's preferred separator.
version_path_separator = os

# Placeholder URL. Overridden at runtime by app/core/db.py::run_migrations
# and by tests/test_migrations.py before any command runs. NEVER points at
# production data on disk.
sqlalchemy.url = sqlite:///./app.db


# Logging configuration. Quiet by default -- pytest captures stderr already.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
