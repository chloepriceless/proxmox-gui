[project]
name = "proxmox-gui"
version = "0.1.0"
description = "Proxmox Self-Service GUI — multi-tenant, multi-cluster Proxmox VE portal."
requires-python = ">=3.12"
authors = [
    { name = "Proxmox Self-Service GUI Contributors" },
]
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "proxmoxer==2.3.0",
    "requests==2.32.3",
    "sqlalchemy[asyncio]==2.0.49",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "pwdlib[argon2]==0.3.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.12.1",
    "cryptography==45.0.7",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "email-validator==2.3.0",
    "structlog==25.5.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "mypy",
    "pytest",
    "pytest-asyncio==1.3.0",
    "respx",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # pwdlib emits DeprecationWarnings from its argon2 backend; benign.
    "ignore::DeprecationWarning",
]
