# T-0183 Option A (tokenlos): Caddy Standard-Image mit tls internal.
# Kein xcaddy-Build, kein dns01.env. LAN_IP via /opt/dolibarr/.env.
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: dolibarr
      MARIADB_USER: dolibarr
      MARIADB_PASSWORD: ${DOLI_DB_PASSWORD}
    volumes: [ "mariadb_data:/var/lib/mysql" ]
    networks: [ internal ]
  dolibarr:
    image: dolibarr/dolibarr:22
    restart: unless-stopped
    depends_on: [ mariadb ]
    environment:
      DOLI_DB_TYPE: mysqli
      DOLI_DB_HOST: mariadb
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: ${DOLI_DB_PASSWORD}
      DOLI_ADMIN_LOGIN: superadmin
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}
      DOLI_URL_ROOT: 'http://192.168.20.175'
      DOLI_PROD: '1'
    # KEIN ports: → nur via Caddy erreichbar; bestehender interner :80-Flow
    # läuft unverändert über Caddys :80-Block weiter.
    volumes:
      - "dolibarr_html:/var/www/html/custom"
      - "dolibarr_docs:/var/www/documents"
    networks: [ internal ]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [ dolibarr ]
    ports:
      - "${LAN_IP}:80:80"      # FAIL-CLOSED: nur LAN-IP (FW filtert Quellen)
      - "${LAN_IP}:443:443"    # FAIL-CLOSED: nur LAN-IP
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"     # persistiert die interne Caddy-CA
      - "caddy_config:/config"
    networks: [ internal ]
volumes:
  mariadb_data: {}
  dolibarr_html: {}
  dolibarr_docs: {}
  caddy_data: {}
  caddy_config: {}
networks:
  internal: {}
